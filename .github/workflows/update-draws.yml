name: Update lottery draw data

on:
  workflow_dispatch:
  schedule:
    - cron: "30-59/5 13 * * *"
    - cron: "*/5 14 * * *"
    - cron: "0,15,30,45 15 * * *"
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update draw data
        run: node scripts/update-draws.js
      - name: Commit draw data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update lottery draw data"
          file_pattern: "data/*.json"
